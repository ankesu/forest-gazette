<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>橘橘森林八卦小报 · 加密频道</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0812;min-height:100vh;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#f0e8d0}
/* 锁屏 */
.lockbox{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.seal{font-size:56px;margin-bottom:16px;animation:pulse 2.5s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,136,0,0.3))}
@keyframes pulse{0%,100%{transform:scale(1)}25%{transform:scale(1.08) rotate(-4deg)}75%{transform:scale(1.08) rotate(4deg)}}
.lockbox h1{font-size:20px;font-weight:900;letter-spacing:4px;color:#ffcc44;margin-bottom:6px}
.lockbox .sub{font-size:12px;color:#887060;letter-spacing:2px;margin-bottom:28px}
.lockbox input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(255,136,0,0.15);background:rgba(10,10,20,0.7);color:#f0e8d0;font-size:14px;font-family:inherit;outline:none;transition:border-color .3s;text-align:center;letter-spacing:2px}
.lockbox input:focus{border-color:rgba(255,136,0,0.4)}
.lockbox .btn{width:100%;margin-top:14px;padding:12px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:3px;background:linear-gradient(135deg,#ff4400,#ff8800);color:#fff;transition:all .3s;font-family:inherit}
.lockbox .btn:disabled{opacity:0.5;cursor:wait}
.lockbox .msg{margin-top:14px;font-size:12px;color:#887060;min-height:18px}
.lockbox .msg.err{color:#ff6655}
.lockbox .foot{margin-top:30px;font-size:10px;color:#4a3a2a;letter-spacing:2px}
.lockbox .hint{margin-top:8px;font-size:10px;color:#3a2a1a}
/* 主界面 */
#main{display:none;max-width:860px;margin:0 auto;padding:16px}
.header{text-align:center;padding:28px 0 16px;border-bottom:3px double #ff6600;margin-bottom:16px}
.header .tag{display:inline-block;background:rgba(0,0,0,0.4);padding:4px 18px;border-radius:50px;font-size:11px;color:#ffcc44;border:1px solid #ff8800;letter-spacing:3px;margin-bottom:10px}
.header h1{font-size:clamp(26px,5vw,40px);font-weight:900;background:linear-gradient(90deg,#ffcc00,#ff6600,#ff00aa,#ff6600,#ffcc00);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rb 3s linear infinite}
@keyframes rb{to{background-position:200% center}}
.header .sub{font-size:12px;color:#887060;letter-spacing:2px;margin-top:6px}
.header .stats{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:11px;color:#665040}
/* 筛选 */
.filter-bar{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:8px;align-items:center}
.filter-pill{font-size:12px;padding:2px 3px;cursor:pointer;color:#887060;transition:all .3s;white-space:nowrap;user-select:none;background:transparent;border:none}
.filter-pill:hover{color:#d0b090}
.filter-pill.active{animation:emoji-flicker 1.6s ease-in-out infinite}
@keyframes emoji-flicker{0%,100%{opacity:1;filter:brightness(1)}25%{opacity:0.65;filter:brightness(0.4)}50%{opacity:0.4;filter:brightness(0.2)}75%{opacity:0.65;filter:brightness(0.4)}}
.filter-pill[data-bc="red"].active{color:#ff7766}
.filter-pill[data-bc="orange"].active{color:#ff8833}
.filter-pill[data-bc="yellow"].active{color:#ddbb44}
.filter-pill[data-bc="green"].active{color:#55ee99}
.filter-pill[data-bc="pink"].active{color:#ff88aa}
.filter-pill[data-bc="blue"].active{color:#77bbff}
.filter-pill[data-bc="purple"].active{color:#bb88ff}
.filter-pill[data-bc="white"].active{color:#cccccc}
.filter-pill[data-bc="other"].active{color:#b09878}
.filter-pill[data-author].active{color:#ff8800}
.filter-right{display:flex;align-items:center;gap:4px;margin-left:auto;flex-shrink:0}
.filter-info{font-size:12px;color:#665040;white-space:nowrap}
.filter-clear{font-size:12px;color:#665040;cursor:pointer;display:none;padding:2px 6px;border-radius:4px}
.filter-clear.show{display:inline-flex}
.filter-clear:hover{color:#ff8800}
/* 搜索 */
.search-pill{display:flex;align-items:center;width:100%;margin-bottom:12px}
.search-pill input{width:100%;padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.04);color:#d0c0b0;font-size:12px;font-family:inherit;outline:none;transition:border-color .3s;line-height:18px;box-sizing:border-box}
.search-pill input:focus{border-color:rgba(255,136,0,0.30)}
.search-pill input::placeholder{color:#5a4030}
/* 文章卡片 */
.post{background:rgba(15,12,20,0.85);border-radius:16px;margin-bottom:16px;padding:18px 20px 14px;border:1px solid rgba(255,136,0,0.12);box-shadow:0 4px 30px rgba(0,0,0,0.4);position:relative;cursor:pointer;transition:all .3s;overflow:hidden}
.post:hover{border-color:rgba(255,136,0,0.3);transform:translateY(-2px)}
.post .corner-num{position:absolute;right:14px;top:8px;font-size:13px;font-weight:900;color:rgba(255,136,0,0.25);font-family:'Rubik Glitch',monospace}
.post .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.post .meta .date{font-size:12px;color:#aa8866}
.post .meta .badge{font-size:10px;padding:2px 10px;border-radius:6px;font-weight:700;letter-spacing:1px}
.post .meta .badge.red{background:rgba(220,50,40,0.18);color:#dd5544}
.post .meta .badge.orange{background:rgba(255,105,10,0.20);color:#ff7722}
.post .meta .badge.yellow{background:rgba(200,160,30,0.16);color:#ccaa33}
.post .meta .badge.green{background:rgba(60,210,120,0.16);color:#44dd88}
.post .meta .badge.pink{background:rgba(240,90,160,0.20);color:#ff5e8a}
.post .meta .badge.blue{background:rgba(60,140,230,0.16);color:#5599dd}
.post .meta .badge.purple{background:rgba(140,60,230,0.16);color:#aa77ee}
.post .meta .badge.white{background:rgba(200,200,200,0.10);color:#aaaaaa}
.post .meta .badge.other{background:rgba(180,150,120,0.14);color:#b09878}
.post h2{font-size:clamp(16px,2.5vw,20px);font-weight:700;color:#f0e0c0;line-height:1.4;margin-bottom:8px}
.post .desc{font-size:13px;line-height:1.7;color:#a09080;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post .tags{display:flex;flex-wrap:wrap;gap:4px}
.post .tags span{font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,0.04);color:#887060;border:1px solid rgba(255,136,0,0.06)}
.post .author-tag{position:absolute;right:14px;bottom:10px;font-size:10px;color:#665040}
/* 阅读窗 */
#rv{display:none;position:fixed;inset:0;background:transparent;z-index:60;overflow:auto}
.rh{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,0.28);backdrop-filter:blur(4px);border-radius:10px;padding:3px 8px;display:flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,0.06);transition:opacity .4s}
.rh.collapse{opacity:0.25}
.rh.collapse:hover{opacity:1}
.rh .bb{background:transparent;border:1px solid rgba(255,255,255,0.08);padding:2px 7px;border-radius:6px;font-size:11px;cursor:pointer;color:rgba(255,255,255,0.55);font-family:inherit;transition:all .3s;letter-spacing:1px;white-space:nowrap}
.rh .bb:hover{background:rgba(255,136,0,0.12);color:#ffcc00}
.rh .lb{font-size:10px;color:rgba(255,255,255,0.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:25vw}
.ri{position:absolute;inset:0;width:100%;height:100%;border:none;background:transparent}
.ft{text-align:center;padding:30px 16px 18px;color:#665040;font-size:12px;line-height:1.8}
.ft .seal{font-size:22px;animation:ftPulse 2.5s ease-in-out infinite}
@keyframes ftPulse{0%,100%{transform:scale(1) rotate(0deg);opacity:0.8}25%{transform:scale(1.1) rotate(-3deg)}50%{transform:scale(1.1) rotate(3deg)}}
.ft .brand{font-size:15px;color:#e8c8a0;letter-spacing:5px;font-weight:700}
.ft .dot{color:#44dd66;animation:ftBlink 1.2s ease-in-out infinite;display:inline-block}
@keyframes ftBlink{0%,100%{opacity:0.2}50%{opacity:1}}
.ft .code{font-size:10px;color:#3a2a1a;letter-spacing:2px;margin-top:6px}
/* 加载中 */
.loading-article{text-align:center;padding:40px;color:#887060;font-size:13px}
@media(max-width:640px){#main{padding:10px}.post{padding:14px 16px}}
</style>

var ARTICLES=[], activeProtocol='', activeAuthor=null, searchText='';

function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64e(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function decJSON(payload){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(payload.pwd),{name:'PBKDF2'},false,['deriveKey'])
    .then(function(k){return crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64d(payload.salt),iterations:100000,hash:'SHA-256'},
      k,{name:'AES-GCM',length:256},false,['decrypt'])})
    .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(payload.iv)},key,b64d(payload.ct))})
    .then(function(pt){return new TextDecoder().decode(pt)});
}
async function unlock(){
  var pwd=document.getElementById('pwd').value;
  var msg=document.getElementById('msg');
  var btn=document.getElementById('unlockBtn');
  if(!pwd){msg.textContent='喵？请输入密码';msg.className='msg err';return}
  btn.disabled=true;btn.textContent='解锁中…';msg.textContent='';msg.className='msg';
  try{
    var metaStr=await decJSON({pwd:pwd,salt:META_SALT,iv:META_IV,ct:META_CT});
    ARTICLES=JSON.parse(metaStr);
    document.getElementById('lock').style.display='none';
    document.getElementById('main').style.display='block';
    initUI();
  }catch(e){
    btn.disabled=false;btn.textContent='解 锁';
    msg.textContent='密码不对，重新想想？';msg.className='msg err';
  }
}
document.getElementById('pwd').addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});

/* ---------- 列表渲染 ---------- */
var PROTOCOLS=[['red','🔴 审讯室'],['orange','🟠 重磅'],['yellow','🟡 苦瓜'],['green','🟢 绿闻'],['pink','🌸 花边'],['blue','🔵 教学'],['purple','🟣 论文'],['white','⚪ 吐槽']];
var AUTHORS=['DeepSeek','Hy','GLM','Kimi','MiniMax','Other'];
function initUI(){
  document.getElementById('stTotal').textContent='📄 '+ARTICLES.length+' ISSUES';
  var pb=document.getElementById('protocolBar');
  PROTOCOLS.forEach(function(p){
    var s=document.createElement('span');
    s.className='filter-pill';s.dataset.bc=p[0];s.textContent=p[1];
    s.onclick=function(){toggleProtocol(p[0],s)};pb.appendChild(s);
  });
  var ar=document.createElement('span');ar.className='filter-pill';ar.dataset.bc='other';ar.textContent='🪶 Other';
  ar.onclick=function(){toggleProtocol('other',ar)};pb.appendChild(ar);
  var info=document.createElement('span');info.className='filter-info';info.id='filterInfo';info.style.marginLeft='auto';pb.appendChild(info);
  var clear=document.createElement('span');clear.className='filter-clear';clear.id='filterClear';clear.textContent='✕';
  clear.onclick=function(){clearFilter()};pb.appendChild(clear);
  var ab=document.getElementById('authorBar');
  AUTHORS.forEach(function(a){
    var s=document.createElement('span');
    s.className='filter-pill';s.dataset.author=a;
    s.textContent={DeepSeek:'🦊 DS',Hy:'🦊 Hy',GLM:'🦌 GLM',Kimi:'🦊 Kimi',MiniMax:'🦊 MiniMax',Other:'🪶 Other'}[a];
    s.onclick=function(){toggleAuthor(a,s)};ab.appendChild(s);
  });
  applyFilter();
}
function toggleProtocol(bc,el){
  var tags=document.querySelectorAll('.filter-pill[data-bc]');
  if(activeProtocol===bc){activeProtocol='';tags.forEach(function(t){t.classList.remove('active')})}
  else{activeProtocol=bc;tags.forEach(function(t){t.classList.remove('active')});el.classList.add('active')}
  applyFilter();
}
function toggleAuthor(name,el){
  var tags=document.querySelectorAll('.filter-pill[data-author]');
  if(activeAuthor===name){activeAuthor=null;tags.forEach(function(t){t.classList.remove('active')})}
  else{activeAuthor=name;tags.forEach(function(t){t.classList.remove('active')});el.classList.add('active')}
  applyFilter();
}
function clearFilter(){
  activeProtocol='';activeAuthor=null;searchText='';
  document.querySelectorAll('.filter-pill').forEach(function(t){t.classList.remove('active')});
  document.getElementById('searchInput').value='';
  applyFilter();
}
function applyFilter(){
  searchText=document.getElementById('searchInput').value.toLowerCase();
  var tl=document.getElementById('timeline');tl.innerHTML='';
  var showCount=0;
  ARTICLES.forEach(function(a){
    var ma=!activeAuthor||a.author===activeAuthor||(activeAuthor==='Other'&&a.author==='Other');
    var mp=!activeProtocol||a.bc===activeProtocol;
    var ms=!searchText||(a.title+a.desc+(a.tags||[]).join(' ')).toLowerCase().indexOf(searchText)>-1;
    if(ma&&mp&&ms){
      showCount++;
      tl.appendChild(makeCard(a));
    }
  });
  var info=document.getElementById('filterInfo');
  if(info)info.textContent='📄 '+showCount+' / '+ARTICLES.length+' 篇';
  var clear=document.getElementById('filterClear');
  if(clear)clear.classList.toggle('show',!!(activeProtocol||activeAuthor||searchText));
}
function makeCard(a){
  var d=document.createElement('div');
  d.className='post';d.dataset.author=a.author;d.dataset.bc=a.bc;
  d.onclick=function(){openArticle(a)};
  var tags=(a.tags||[]).map(function(t){return '<span>#'+t+'</span>'}).join('');
  d.innerHTML='<div class="corner-num">'+a.id.replace('a','')+'</div>'+
    '<div class="meta"><span class="date">📆 '+a.date+'</span><span class="badge '+a.bc+'">'+a.badge+'</span></div>'+
    '<h2>'+a.title+'</h2><div class="desc">'+a.desc+'</div>'+
    '<div class="tags">'+tags+'</div>'+
    '<div class="author-tag">'+(a.author||'')+'</div>';
  return d;
}

/* ---------- 文章阅读（fetch + 解密） ---------- */
function openArticle(a){
  var rv=document.getElementById('rv'),ri=document.getElementById('ri'),rt=document.getElementById('rt');
  rt.textContent='// '+a.title+' //';
  ri.srcdoc='<div class="loading-article">🔒 正在解密…</div>';
  rv.style.display='block';document.body.style.overflow='hidden';
  fetch('articles/'+a.enc).then(function(r){return r.json()}).then(function(payload){
    return decJSON({pwd:sessionStorage.getItem('julu_pwd'),salt:payload.salt,iv:payload.iv,ct:payload.ct});
  }).then(function(html){
    ri.srcdoc=html;
    setTimeout(function(){document.querySelector('.rh').classList.add('collapse')},3000);
  }).catch(function(e){
    ri.srcdoc='<div class="loading-article">❌ 解密失败：'+e.message+'</div>';
  });
}
function closeReader(){
  document.getElementById('rv').style.display='none';
  document.getElementById('ri').srcdoc='';
  document.body.style.overflow='';
}
document.getElementById('rv').addEventListener('click',function(e){if(e.target.id==='rv')closeReader()});
window.addEventListener('keydown',function(e){if(e.key==='Escape')closeReader()});

/* 记住密码（当前会话） */
(function(){
  var s=sessionStorage.getItem('julu_pwd');
  if(s){document.getElementById('pwd').value=s;document.getElementById('unlockBtn').click()}
})();
</script>
