<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;min-height:100vh;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#f0e8d0;display:flex;align-items:center;justify-content:center;padding:20px;background-image:linear-gradient(rgba(255,160,50,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,160,50,0.04) 1px,transparent 1px);background-size:40px 40px}
.lockbox{max-width:420px;width:100%;background:rgba(15,12,20,0.9);border:1px solid rgba(255,136,0,0.2);border-radius:20px;padding:40px 32px;text-align:center;box-shadow:0 0 60px rgba(255,68,0,0.08)}

.sub{font-size:12px;color:#887060;letter-spacing:2px;margin-bottom:28px}
input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(255,136,0,0.15);background:rgba(10,10,20,0.7);color:#f0e8d0;font-size:14px;font-family:inherit;outline:none;transition:border-color .3s;text-align:center;letter-spacing:2px}

.btn{width:100%;margin-top:14px;padding:12px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:3px;background:linear-gradient(135deg,#ff4400,#ff8800);color:#fff;transition:all .3s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,68,0,0.3)}
.btn:disabled{opacity:0.5;cursor:wait;transform:none}
.msg{margin-top:14px;font-size:12px;color:#887060;min-height:18px}
.msg.err{color:#ff6655}
.msg.ok{color:#44dd88}
.foot{margin-top:30px;font-size:10px;color:#4a3a2a;letter-spacing:2px}
.hint{margin-top:8px;font-size:10px;color:#3a2a1a;letter-spacing:1px}
#loading{display:none;margin-top:16px;font-size:12px;color:#887060}
#loading .dot{animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:0.2}50%{opacity:1}}

function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64e(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
async function unlock(){
  var pwd=document.getElementById('pwd').value;
  var msg=document.getElementById('msg');
  var btn=document.getElementById('unlock');
  if(!pwd){msg.textContent='喵？请输入密码';msg.className='msg err';return}
  btn.disabled=true;btn.textContent='解锁中…';
  msg.textContent='';msg.className='msg';
  document.getElementById('loading').style.display='block';
  try{
    var enc=new TextEncoder().encode(pwd);
    var salt=b64d(SALT),iv=b64d(IV),ct=b64d(CT);
    var keyMat=await crypto.subtle.importKey('raw',enc,{name:'PBKDF2'},false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},
      keyMat,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){
    btn.disabled=false;btn.textContent='解 锁';
    document.getElementById('loading').style.display='none';
    msg.textContent='密码不对，重新想想？';msg.className='msg err';
  }
}
document.getElementById('pwd').addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});
</script>
